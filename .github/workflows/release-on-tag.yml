name: Build and Release Windows EXE on Tag

on:
  push:
    tags:
      - 'v*'
      - '*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --name interference-source-identidication app.py

      - name: Prepare zip package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item dist/interference-source-identidication.exe release/
          Compress-Archive -Path release/interference-source-identidication.exe -DestinationPath interference-source-identidication-${{ github.ref_name }}-windows.zip -Force

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: interference-source-identidication-${{ github.ref_name }}-windows.zip
          generate_release_notes: true
